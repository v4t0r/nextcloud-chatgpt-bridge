[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "nextcloud-chatgpt-bridge"
version = "0.1.0"
description = "MCP-first bridge connecting ChatGPT with Nextcloud services."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "v4t0r" }]
requires-python = ">=3.11"
keywords = ["nextcloud", "chatgpt", "codex", "mcp", "webdav"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "defusedxml>=0.7,<1",
  "httpx>=0.27,<1",
  "httpx2>=2.5,<3",
  "mcp>=2,<3",
  "PyJWT[crypto]>=2.10,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
hosted = [
  "cryptography>=50,<51",
  "psycopg[binary]>=3.3.4,<4",
  "SQLAlchemy>=2.0.51,<2.1",
]
dev = [
  "cryptography>=50,<51",
  "mcp[cli]>=2,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.6,<1",
  "SQLAlchemy>=2.0.51,<2.1",
]
release = [
  "build>=1.3,<2",
  "pip-audit>=2.9,<3",
  "twine>=6,<8",
]

[project.urls]
Homepage = "https://github.com/v4t0r/nextcloud-chatgpt-bridge"
Repository = "https://github.com/v4t0r/nextcloud-chatgpt-bridge.git"
Issues = "https://github.com/v4t0r/nextcloud-chatgpt-bridge/issues"
Changelog = "https://github.com/v4t0r/nextcloud-chatgpt-bridge/blob/main/CHANGELOG.md"

[project.scripts]
nextcloud-chatgpt-bridge = "nextcloud_chatgpt_bridge.server:main"
nextcloud-chatgpt-diagnose = "nextcloud_chatgpt_bridge.diagnostics:main"
nextcloud-chatgpt-schema = "nextcloud_chatgpt_bridge.migration:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nextcloud_chatgpt_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "S101"]
