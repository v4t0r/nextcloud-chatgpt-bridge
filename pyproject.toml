[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nextcloud-chatgpt-bridge"
version = "0.1.0"
description = "MCP-first bridge connecting ChatGPT with Nextcloud services."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "defusedxml>=0.7,<1",
  "httpx>=0.27,<1",
  "mcp>=2,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
dev = [
  "mcp[cli]>=2,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
nextcloud-chatgpt-bridge = "nextcloud_chatgpt_bridge.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nextcloud_chatgpt_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
