name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate tag version
        shell: bash
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
          test -f "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install ".[dev,release]"

      - name: Test and lint
        run: |
          ruff check .
          python -m pip check
          pytest --cov=nextcloud_chatgpt_bridge --cov-report=term-missing
          python -m pip_audit --skip-editable

      - name: Build and validate artifacts
        run: |
          python -m build
          python -m twine check dist/*
          sha256sum dist/* > dist/SHA256SUMS

      - name: Verify wheel installation
        run: |
          python -m venv wheelcheck
          wheelcheck/bin/pip install dist/*.whl
          wheelcheck/bin/nextcloud-chatgpt-bridge --version
          wheelcheck/bin/nextcloud-chatgpt-schema | grep "CREATE TABLE bridge_schema_migrations"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextcloud-chatgpt-bridge-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag
          --title "${GITHUB_REF_NAME} — Developer Release"
          --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
