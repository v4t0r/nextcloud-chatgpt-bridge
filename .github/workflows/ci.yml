name: CI

on:
  push:
    branches: [main, "bootstrap/**", "feature/**", "fix/**", "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: |
          python -m pip check
          pytest --cov=nextcloud_chatgpt_bridge --cov-report=term-missing

  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Build release artifacts
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install ".[release]"
          python -m build

      - name: Validate release metadata
        run: python -m twine check dist/*

      - name: Verify wheel installation
        run: |
          python -m venv wheelcheck
          wheelcheck/bin/pip install dist/*.whl
          wheelcheck/bin/nextcloud-chatgpt-bridge --version
          wheelcheck/bin/nextcloud-chatgpt-diagnose --version
          wheelcheck/bin/nextcloud-chatgpt-schema | grep "CREATE TABLE bridge_schema_migrations"
